<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Kusisiña</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-noche" style="min-height:100vh;">

<nav class="navbar navbar-kusi">
  <div class="container">
    <a class="navbar-brand" href="index.html">Kusi<span>siña</span></a>
    <button class="btn-idioma" data-accion="alternar-idioma" aria-label="Cambiar idioma / Aru tukuyaña" title="Español / Aymara"><span data-i18n-toggle-label>AY</span></button>
  </div>
</nav>
<div class="telar telar-fina" aria-hidden="true"></div>

<div class="container py-5 d-flex align-items-center" style="min-height:75vh;">
  <div class="row justify-content-center w-100">
    <div class="col-lg-5 col-md-7">
      <div class="card-kusi p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-people-fill text-terracota" style="font-size:2.5rem;"></i>
          <h1 class="fs-3 text-noche mt-2" data-i18n="login_titulo">Ingresar a mi familia</h1>
        </div>
        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold" data-i18n="login_codigo">Código de familia</label>
            <input type="text" class="form-control text-uppercase" id="fCodigo" placeholder="KUSI-XXXX" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" data-i18n="registro_clave">Contraseña</label>
            <input type="password" class="form-control" id="fClave" required>
          </div>
          <button type="submit" class="btn-kusi-primario w-100" data-i18n="login_boton">Entrar a jugar</button>
        </form>
        <p class="text-center small text-muted mt-3">
          <span data-i18n="login_sinCuenta">¿Todavía no tienen cuenta familiar?</span>
          <a href="registro.html" data-i18n="nav_registro">Crear cuenta familiar</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/db.js"></script>
<script src="js/gamification.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById("formLogin").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const formulario = e.target;
  formulario.classList.add("was-validated");
  if (!formulario.checkValidity()) return;
  if (!(await iniciarDB())) return;
  const codigo = document.getElementById("fCodigo").value.trim().toUpperCase();
  const clave = document.getElementById("fClave").value;
  const fam = DB.query(`SELECT * FROM familias WHERE codigo=?`, [codigo])[0];

  const errorCredenciales = () => Swal.fire(
    I18N.idiomaActual()==="es" ? "Código o contraseña incorrectos" : "Código jan walikiti", "", "error"
  );

  if (!fam) { errorCredenciales(); return; }

  let claveValida = false;
  if (fam.clave_hash && fam.clave_salt){
    const intento = await DB.hashClave(clave, fam.clave_salt);
    claveValida = intento === fam.clave_hash;
  } else if (fam.clave){
    // Cuenta creada antes de esta versión (contraseña aún en texto plano):
    // si coincide, la migramos a hash en este mismo momento.
    claveValida = fam.clave === clave;
    if (claveValida){
      const salt = DB.generarSalt();
      const hash = await DB.hashClave(clave, salt);
      DB.run(`UPDATE familias SET clave_hash=?, clave_salt=?, clave=NULL WHERE id=?`, [hash, salt, fam.id]);
    }
  }

  if (!claveValida){ errorCredenciales(); return; }

  SESION.guardar(fam.id);
  window.location.href = "dashboard.html";
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rueda de Emociones · Kusisiña</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-noche" style="min-height:100vh;">

<nav class="navbar navbar-kusi">
  <div class="container">
    <a class="navbar-brand" href="index.html">Kusi<span>siña</span></a>
    <div class="d-flex gap-2">
      <button class="btn-idioma" data-accion="alternar-idioma" aria-label="Cambiar idioma / Aru tukuyaña" title="Español / Aymara"><span data-i18n-toggle-label>AY</span></button>
      <a href="actividades.html" class="btn btn-outline-light btn-sm rounded-pill px-3"><i class="bi bi-x-lg"></i></a>
    </div>
  </div>
</nav>
<div class="telar telar-fina" aria-hidden="true"></div>

<div class="container py-4 py-md-5">
  <div class="row justify-content-center text-center text-white mb-3">
    <div class="col-lg-7">
      <h1 class="fs-2" data-i18n="juego_titulo">Rueda de Emociones</h1>
      <p class="text-white-50" data-i18n="juego_instr">Giren la rueda por turnos. Cuando se detenga, quien giró cuenta una vez en que sintió esa emoción, y la otra persona escucha sin interrumpir.</p>
    </div>
  </div>

  <div class="row justify-content-center g-4">
    <div class="col-md-6 text-center">
      <div class="chip-nivel mb-3" id="chipTurno"><i class="bi bi-person-fill"></i> <span data-i18n="juego_turno">Turno de</span>: <span id="nombreTurno">—</span></div>

      <div class="rueda-contenedor">
        <div class="rueda-puntero"></div>
        <svg class="rueda-svg" id="ruedaJuego" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <button id="btnGirar" class="btn-kusi-primario mt-4" data-i18n="juego_girar">
        Girar la rueda
      </button>
    </div>

    <div class="col-md-6">
      <div class="card-kusi p-4 h-100 d-flex flex-column">
        <h2 class="fs-5 text-noche"><i class="bi bi-chat-square-heart text-magenta me-2"></i><span id="tituloResultado">—</span></h2>
        <p class="text-muted" id="pistaResultado">Giren la rueda para comenzar.</p>

        <div class="mt-auto">
          <label class="form-label small text-muted" id="labelReflexion" for="reflexion">Anota una palabra o dibuja lo que sintieron (opcional):</label>
          <textarea class="form-control mb-3" id="reflexion" rows="2" placeholder="..."></textarea>
          <button id="btnRegistrar" class="btn-kusi-verde w-100" disabled data-i18n="juego_registrar">
            Ya conversamos, sumar puntos
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/db.js"></script>
<script src="js/gamification.js"></script>
<script src="js/main.js"></script>
<script src="js/juego-emociones.js"></script>
</body>
</html>

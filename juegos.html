<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Kusisiña · Minijuegos educativos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-kusi">
  <div class="container">
    <a class="navbar-brand" href="index.html">Kusi<span>siña</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navKusi" aria-controls="navKusi" aria-expanded="false" aria-label="Abrir menú de navegación">
      <i class="bi bi-list text-white fs-3"></i>
    </button>
    <div class="collapse navbar-collapse" id="navKusi">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="nav_inicio">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="actividades.html" data-i18n="nav_actividades">Actividades</a></li>
        <li class="nav-item"><a class="nav-link active" href="juegos.html" data-i18n="nav_juegos">Arcade</a></li>
        <li class="nav-item"><a class="nav-link" href="educacion.html" data-i18n="nav_educacion">Aprender</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html" data-i18n="nav_dashboard">Mi familia</a></li>
        <li class="nav-item"><button class="btn-idioma" data-accion="alternar-idioma" aria-label="Cambiar idioma / Aru tukuyaña" title="Español / Aymara"><span data-i18n-toggle-label>AY</span></button></li>
      </ul>
    </div>
  </div>
</nav>
<div class="telar telar-fina" aria-hidden="true"></div>

<header class="hero-kusi py-4">
  <div class="container position-relative" style="z-index:2;">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div>
        <div class="eyebrow mb-1">Arcade Kusisiña</div>
        <h1 class="fs-2 mb-0">🎮 <span data-i18n-arcade-titulo>Minijuegos para aprender jugando</span></h1>
      </div>
      <div class="barra-estado-jugador" id="estadoJugador">
        <span class="item-estado item-xp"><i class="bi bi-lightning-charge-fill"></i> — XP</span>
        <span class="item-estado item-monedas"><i class="bi bi-coin"></i> —</span>
        <span class="item-estado item-nivel"><i class="bi bi-flower1"></i> —</span>
      </div>
    </div>
  </div>
</header>
<div class="telar telar-fina" aria-hidden="true"></div>

<section class="seccion pt-4">
  <div class="container">

    <!-- Catálogo -->
    <div id="catalogoJuegos">
      <p class="text-muted">
        <i class="bi bi-info-circle text-terracota"></i>
        <span data-i18n-arcade-info>Cada minijuego da XP y monedas. Al juntar suficiente XP en familia, se desbloquean los siguientes niveles y minijuegos.</span>
      </p>
      <div class="row g-4" id="grillaJuegos"></div>
    </div>

    <!-- Contenedor donde se dibuja el minijuego activo -->
    <div id="contenedorJuego" class="d-none">
      <button class="btn btn-kusi-secundario btn-sm mb-4" id="btnVolverCatalogo">
        <i class="bi bi-arrow-left me-1"></i> <span data-i18n-arcade-volver>Volver al Arcade</span>
      </button>
      <!-- el minijuego se renderiza aquí vía JS -->
    </div>

  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/db.js"></script>
<script src="js/gamification.js"></script>
<script src="js/main.js"></script>
<script src="js/juegos-data.js"></script>
<script src="js/juegos-minijuegos.js"></script>
<script src="js/juegos-engine.js"></script>
<script>
  // Textos cortos que no viven en el diccionario global (propios de esta página)
  document.addEventListener("DOMContentLoaded", ()=>{
    const textos = {
      es: { titulo:"Minijuegos para aprender jugando", info:"Cada minijuego da XP y monedas. Al juntar suficiente XP en familia, se desbloquean los siguientes niveles y minijuegos.", volver:"Volver al Arcade" },
      ay: { titulo:"Anatasa yatiqañataki", info:"Sapa anataw XP ukat qullqi churi. XP wal apthapisa, qhipa nivelnaka jistʼarasi.", volver:"Arcaderu kutt'aña" }
    };
    function aplicarTextosLocales(){
      const t = textos[I18N.idiomaActual()];
      document.querySelector("[data-i18n-arcade-titulo]").textContent = t.titulo;
      document.querySelector("[data-i18n-arcade-info]").textContent = t.info;
      document.querySelector("[data-i18n-arcade-volver]").textContent = t.volver;
    }
    aplicarTextosLocales();
    document.querySelectorAll("[data-accion='alternar-idioma']").forEach(b=> b.addEventListener("click", ()=> setTimeout(aplicarTextosLocales, 10)));
  });
</script>
</body>
</html>
